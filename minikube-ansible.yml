---
- name: Configurar Minikube y Kubernetes local
  hosts: localhost
  connection: local
  become: false

  vars:
    minikube_driver: "docker"
    minikube_cpus: 2
    minikube_memory: "4096"
    minikube_disk_size: "20g"

  tasks:
    - name: Verificar si Minikube está instalado
      command: minikube version
      register: minikube_installed
      ignore_errors: yes
      changed_when: false

    - name: Instalar Minikube (si no está instalado)
      block:
        - name: Descargar Minikube
          get_url:
            url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
            dest: /tmp/minikube
            mode: '0755'

        - name: Mover Minikube a /usr/local/bin
          copy:
            src: /tmp/minikube
            dest: /usr/local/bin/minikube
            remote_src: yes
            mode: '0755'
      when: minikube_installed is failed

    - name: Eliminar cluster Minikube existente (si existe)
      command: minikube delete
      ignore_errors: yes
      register: minikube_deleted
      changed_when: "'Deleted' in minikube_deleted.stdout or 'not found' in minikube_deleted.stderr"

    - name: Iniciar cluster de Minikube
      command: "minikube start --driver={{ minikube_driver }} --cpus={{ minikube_cpus }} --memory={{ minikube_memory }} --disk-size={{ minikube_disk_size }}"
      register: minikube_start
      changed_when: "'Done!' in minikube_start.stdout"

    - name: Configurar el contexto de kubectl
      command: minikube update-context
      register: update_context
      changed_when: "'Updated' in update_context.stdout"

    - name: Verificar estado de Minikube
      command: minikube status
      register: minikube_status
      changed_when: false

    - name: Mostrar estado de Minikube
      debug:
        var: minikube_status.stdout_lines

    - name: Verificar conexión con Kubernetes
      command: kubectl cluster-info
      register: cluster_info
      changed_when: false
      ignore_errors: yes

    - name: Mostrar información del cluster
      debug:
        var: cluster_info.stdout_lines

    - name: Instalar complementos recomendados
      command: "minikube addons enable {{ item }}"
      loop:
        - metrics-server
        - dashboard
        - ingress
      register: addons_enabled
      changed_when: "'was successfully enabled' in addons_enabled.stdout"

    - name: Mostrar URL del dashboard
      command: minikube dashboard --url
      register: dashboard_url
      changed_when: false

    - name: Mostrar enlace al dashboard
      debug:
        msg: "Dashboard disponible en: {{ dashboard_url.stdout }}"
      when: dashboard_url.stdout != ""
